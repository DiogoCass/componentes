    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 300ms cubic-bezier(0.4, 0, 0.2, 1), 
                        color 300ms cubic-bezier(0.4, 0, 0.2, 1), 
                        border-color 300ms cubic-bezier(0.4, 0, 0.2, 1), 
                        width 300ms cubic-bezier(0.4, 0, 0.2, 1), 
                        opacity 300ms cubic-bezier(0.4, 0, 0.2, 1),
                        transform 300ms cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        body {
            --BG: hsl(220, 20%, 97%);
            --FG: hsl(220, 20%, 25%);
            --FG2: hsl(220, 20%, 95%);
            --BG2: hsl(220, 30%, 10%);
            --SEP: hsl(220, 15%, 88%);
            --N500: hsl(220, 10%, 50%);
            --N300: hsl(220, 15%, 90%);
            --G500: hsl(235, 65%, 52%);
            --OVERLAY: rgba(15, 23, 42, 0.6);
        }

        body.dark {
            --FG: hsl(220, 15%, 85%);
            --BG: hsl(220, 25%, 07%);
            --BG2: hsl(220, 15%, 95%);
            --FG2: hsl(220, 20%, 30%);
            --SEP: hsl(220, 18%, 15%);
            --N500: hsl(220, 10%, 45%);
            --N300: hsl(220, 15%, 16%);
            --G500: hsl(215, 80%, 65%);
        }

        .icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
            display: inline-block;
            vertical-align: middle;
        }

        /* Correção e controle visual dos ícones de tema */
        .icon-light, .icon-dark { display: none; }
        body.dark .icon-light { display: inline-block; }
        body:not(.dark) .icon-dark { display: inline-block; }

        /* Banner Promocional de Instalação Nativo In-App */
        .install-banner {
            position: fixed;
            top: 1rem;
            left: 5%;
            width: 90%;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            padding: 1rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transform: translateY(-150%);
            opacity: 0;
            pointer-events: none;
        }
        .install-banner.show {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .install-info { display: flex; align-items: center; gap: 0.75rem; }
        .install-img { width: 40px; height: 40px; border-radius: 8px; background: white; padding: 4px; }
        .install-text h4 { font-size: 0.9rem; font-weight: 700; }
        .install-text p { font-size: 0.75rem; opacity: 0.9; }
        .btn-install-now { background: white; color: #4f46e5; font-size: 0.8rem; font-weight: 700; padding: 0.5rem 1rem; border-radius: 6px; width: auto; height: auto; }

        /* Splash Screen Moderna com Imagem de Fundo Espiritual */
        .splash-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            color: #f8fafc;
            z-index: 150;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 1;
        }

        .splash-screen.fade-out {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.05);
        }

        .splash-hero-bg {
            position: absolute;
            inset: 0;
            opacity: 0.08;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60' viewBox='0 0 60 60'><path d='M30 0 L60 30 L30 60 L0 30 Z' fill='white' fill-opacity='0.5'/></svg>");
            background-repeat: repeat;
            pointer-events: none;
        }

        .splash-content {
            text-align: center;
            max-width: 24rem;
            padding: 0 2rem;
            z-index: 2;
        }

        /* Imagem de Logo Principal de Alta Definição (Bíblia Sagrada Aberta) */
        .splash-image-logo {
            width: 96px;
            height: 96px;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 8px 16px rgba(99, 102, 241, 0.4));
        }

        .splash-title {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 5px;
            color: #ffffff;
            margin-bottom: 0.75rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .splash-subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 3rem;
            letter-spacing: 0.5px;
        }

        .btn-enter {
            padding: 0.85rem 3rem;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            width: auto;
            height: auto;
        }

        .btn-enter:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(79, 70, 229, 0.5);
        }

        /* Container Principal do App */
        .wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 32rem;
            background-color: var(--BG);
            color: var(--FG);
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header-container {
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 4.5rem;
            border-bottom: 1px solid var(--SEP);
            flex-shrink: 0;
        }

        .header {
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            color: var(--FG);
            z-index: 1;
            position: absolute;
            top: 0;
            left: 0;
            background-color: var(--BG);
            width: 100%;
            height: 4.5rem;
            transform: translateY(0%);
        }

        .theme { color: var(--N500); }
        
        .header .title-text { 
            flex: 1; 
            text-align: left; 
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        .search-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex: 0;
            min-width: 3rem;
            height: 3rem;
            position: relative;
        }
        .search-container.active { flex: 2; }

        .search-input {
            width: 0;
            opacity: 0;
            padding: 0;
            border: 1px solid transparent;
            border-radius: 20px;
            background-color: var(--BG);
            color: var(--FG);
            font-size: 0.85rem;
            height: 2.2rem;
            pointer-events: none;
        }
        .search-container.active .search-input {
            width: 100%;
            opacity: 1;
            padding: 0.4rem 2.5rem 0.4rem 0.8rem;
            border-color: var(--SEP);
            pointer-events: auto;
        }

        .search-btn-inside { position: absolute; right: 0; top: 0; z-index: 2; }
        button {
            width: 3rem;
            height: 3rem;
            border: none;
            background-color: transparent;
            color: var(--N500);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        button:hover { background-color: var(--N300); color: var(--FG); }

        /* Lista de Tags */
        .tags-bar {
            display: flex;
            gap: 0.5rem;
            padding: 0.6rem 1rem;
            background-color: var(--BG);
            border-bottom: 1px solid var(--SEP);
            overflow-x: auto;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .tags-bar::-webkit-scrollbar { display: none; }
        [data-state="edit"] .tags-bar { display: none; }

        .tag-pill {
            padding: 0.4rem 0.9rem;
            background-color: var(--N300);
            color: var(--FG);
            font-size: 0.75rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
        }
        .tag-pill.active {
            background-color: var(--G500);
            color: white;
        }

        /* Barra de Formatação Textual */
        .editor-toolbar {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.25rem 0.5rem;
            background-color: var(--BG);
            border-bottom: 1px solid var(--SEP);
            overflow-x: auto;
            white-space: nowrap;
            height: 3.4rem;
            display: none;
            flex-shrink: 0;
        }
        [data-state="edit"] .editor-toolbar { display: flex; }
        .editor-toolbar button { width: 2.2rem; height: 2.2rem; border-radius: 6px; }
        
        .editor-toolbar select {
            background: transparent;
            border: 1px solid var(--SEP);
            color: var(--FG);
            padding: 0.2rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            height: 2.2rem;
        }

        /* Notas Grid */
        #notes {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: grid;
            gap: 0.85rem;
            grid-template-columns: 1fr 1fr;
            grid-auto-rows: 11rem;
            position: relative;
        }

        #notes:empty::before {
            position: absolute;
            width: 100%;
            top: 5rem;
            left: 0;
            content: "Nenhuma meditação cadastrada.";
            color: var(--N500);
            display: block;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Card Visual */
        .note {
            border: 1px solid var(--SEP);
            border-left: 5px solid var(--SEP);
            padding: 1.2rem 1rem;
            border-radius: 12px;
            background-color: var(--BG);
            overflow: hidden;
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(15px);
            animation: cardFadeIn 400ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes cardFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .note-title-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            margin-bottom: 0.4rem;
            flex-shrink: 0;
        }

        .note-title-text {
            display: inline-block;
            font-weight: 700;
            font-size: 1rem;
        }
        .note-title-text.marquee-active { animation: marqueeLinear 7s linear infinite; }

        @keyframes marqueeLinear {
            0% { transform: translateX(0%); }
            45% { transform: translateX(-35%); }
            55% { transform: translateX(-35%); }
            100% { transform: translateX(0%); }
        }

        .note-tag-indicator {
            align-self: flex-start;
            font-size: 0.65rem;
            font-weight: 700;
            background-color: var(--N300);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            margin-bottom: 0.4rem;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-body-preview { font-size: 0.8rem; overflow: hidden; flex: 1; line-height: 1.45; }
        .note::after {
            position: absolute;
            bottom: 0; right: 0; width: 100%; content: ""; height: 2rem;
            background: linear-gradient(transparent, var(--BG)); pointer-events: none;
        }

        /* Ambiente de Edição Expandida */
        .note[data-edit="true"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border-radius: 0; border: none !important;
            overflow-y: auto; font-size: 1.05rem; z-index: 10; padding: 1.5rem; cursor: text;
            animation: none; opacity: 1; transform: none;
        }
        .note[data-edit="true"] .note-title-container, 
        .note[data-edit="true"]::after,
        .note[data-edit="true"] .note-tag-indicator,
        .note[data-edit="true"] .note-body-preview { display: none; }

        .note[data-edit="true"]:empty::before {
            content: "• Insira aqui as suas anotações...\A• Use a sintaxe de destaque ágil em qualquer linha para cores:\A  {(azul)[Sua frase destacada aqui]}";
            white-space: pre-wrap; color: var(--N500); font-size: 0.95rem; line-height: 1.6; font-style: italic; display: block;
        }

        /* Alertas Flutuantes */
        .toast {
            position: absolute; bottom: 4rem; left: 5%; width: 90%;
            background-color: var(--BG2); color: var(--FG2); padding: 0.8rem 1.2rem;
            border-radius: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            z-index: 120; pointer-events: none; text-align: center;
            font-weight: 600; font-size: 0.85rem; opacity: 0; transform: translateY(15px);
        }
        .toast.show { opacity: 1; transform: translateY(0); }

        .edit-header { z-index: 0; transform: translateY(-100%); }
        [data-state="edit"] .header:not(.edit-header) { z-index: 0; transform: translateY(100%); }
        [data-state="edit"] .edit-header { z-index: 15; transform: translateY(0%); }

        #title[contenteditable]:empty::before { content: "Referência ou Tema principal..."; color: var(--N500); }

        .app-credits {
            width: 100%; text-align: center; padding: 0.75rem 0; font-size: 0.7rem;
            color: var(--N500); background-color: var(--BG); border-top: 1px solid var(--SEP);
            letter-spacing: 0.5px; flex-shrink: 0; font-weight: 500;
        }
        .app-credits b { color: var(--G500); }
    </style>
</head>
<body>

<div class="install-banner" id="pwa-install-banner">
    <div class="install-info">
        <img class="install-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%234f46e5'/><path d='M256 90c-35 0-68 15-92 40-24-25-57-40-92-40-60 0-108 48-108 108v200c0 10 8 18 18 18h172c3 0 7-1 10-4l92-92 92 92c3 3 7 4 10 4h172c10 0 18-8 18-18V198c0-60-48-108-108-108-35 0-68 15-92 40-24-25-57-40-92-40z' fill='%23ffffff'/></svg>" alt="Logo">
        <div class="install-text">
            <h4>Instalar Caderno</h4>
            <p>Acesse em tela cheia e offline!</p>
        </div>
    </div>
    <button class="btn-install-now" onclick="triggerPWAInstallation()">INSTALAR</button>
</div>

<div class="splash-screen" id="splash">
    <div class="splash-hero-bg"></div>
    <div class="splash-content">
        <svg class="splash-image-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 21C15.866 21 19 17.866 19 14V5C19 4.44772 18.5523 4 18 4H13C12.4477 4 12 4.44772 12 5V21Z" fill="#818cf8"/>
            <path d="M12 21C8.13401 21 5 17.866 5 14V5C5 4.44772 5.44772 4 6 4H11C11.5523 4 12 4.44772 12 5V21Z" fill="#6366f1"/>
            <path d="M12 18C15.5 18 18 15.5 18 13V5H13V18H12Z" fill="#eef2ff" opacity="0.8"/>
            <path d="M12 18C8.5 18 6 15.5 6 13V5H11V18H12Z" fill="#ffffff"/>
        </svg>
        <div class="splash-title">JÓIAS ESPIRITUAIS</div>
        <div class="splash-subtitle">Seu espaço pessoal offline de meditação teocrática e preparação de reuniões.</div>
        <button class="btn-enter" onclick="enterApp()">
            <span>ABRIR CADERNO</span>
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg></span>
        </button>
    </div>
</div>

<div class="wrapper" data-state="">
    <div class="header-container">
        <div class="header">
            <span class="title-text">MEUS ESTUDOS</span>
            <div class="search-container" id="search-container">
                <input type="text" id="search-bar" class="search-input" placeholder="Buscar estudos..." oninput="filterNotes()">
                <button class="search-btn-inside" onclick="toggleSearch()" title="Pesquisar">
                    <span class="icon"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span>
                </button>
            </div>
            <button onclick="addNote()" title="Nova Meditação">
                <span class="icon"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></span>
            </button>
            <button class="theme" onclick="toggleTheme()" title="Mudar Tema">
                <span class="icon icon-light"><svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.38-.38.38-1.02 0-1.41zM5.99 18.01l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.02-.39-1.41 0z"/></svg></span>
                <span class="icon icon-dark"><svg viewBox="0 0 24 24"><path d="M12.3 2a10 10 0 0 0-1.9 14 10 10 0 0 0 14-1.9 1 1 0 0 0-1-1.4 8 8 0 1 1-9.7-9.7 1 1 0 0 0-1.4-1z"/></svg></span>
            </button>
        </div>
        <div class="header edit-header">
            <span id="title" class="title-text" contenteditable="true">Título</span>
            <button onclick="deleteNote()" title="Excluir"><span class="icon"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></span></button>
            <button onclick="saveNote()" title="Salvar"><span class="icon"><svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg></span></button>
        </div>
    </div>

    <div class="tags-bar" id="tags-bar"></div>

    <div class="editor-toolbar">
        <button onclick="format('bold')"><span class="icon"><svg viewBox="0 0 24 24"><path d="M15.6 10.79c.97-.67 1.65-1.77 1.65-2.79 0-2.26-1.75-4-4-4H7v14h7.04c2.09 0 3.71-1.7 3.71-3.79 0-1.52-.86-2.82-2.15-3.42zM10 6.5h3c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-3v-3zm3.5 11H10v-3h3.5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5z"/></svg></span></button>
        <button onclick="format('italic')"><span class="icon"><svg viewBox="0 0 24 24"><path d="M10 4v3h2.21l-3.42 8H6v3h8v-3h-2.21l3.42-8H18V4z"/></svg></span></button>
        <button onclick="format('underline')"><span class="icon"><svg viewBox="0 0 24 24"><path d="M12 17c3.31 0 6-2.69 6-6V3h-2.5v8c0 1.93-1.57 3.5-3.5 3.5S8.5 12.93 8.5 11V3H6v8c0 3.31 2.69 6 6 6zm-7 2v2h14v-2H5z"/></svg></span></button>
        
        <select onchange="format('fontName', this.value); this.selectedIndex=0;">
            <option value="" selected disabled>Fonte</option>
            <option value="-apple-system, BlinkMacSystemFont, sans-serif">Padrão</option>
            <option value="Georgia, serif">Clássica</option>
            <option value="Courier New, monospace">Estruturada</option>
        </select>

        <select onchange="format('fontSize', this.value); this.selectedIndex=0;">
            <option value="" selected disabled>Tamanho</option>
            <option value="2">Pequeno</option>
            <option value="4">Normal</option>
            <option value="6">Grande</option>
        </select>

        <button onclick="format('justifyLeft')"><span class="icon"><svg viewBox="0 0 24 24"><path d="M15 15H3v2h12v-2zm0-8H3v2h12V7zM3 13h18v-2H3v2zm0 8h18v-2H3v2zM3 3v2h18V3H3z"/></svg></span></button>
        <button onclick="format('justifyCenter')"><span class="icon"><svg viewBox="0 0 24 24"><path d="M7 15v2h10v-2H7zm-4 4v2h18v-2H3zm4-12v2h10V7H7zm-4-4v2h18V3H3zm2 10h14v-2H5v2z"/></svg></span></button>
        <button onclick="format('insertUnorderedList')"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/></svg></span></button>
        
        <button onclick="insertHighlightPlaceholder()" title="Marca-Texto Rápido"><span class="icon"><svg viewBox="0 0 24 24"><path d="M17.66 8L12 2.35 6.34 8l5.66 5.66L17.66 8zm-5.66-4.24L15.54 7H8.46l3.54-3.24zM3 20h18v2H3z"/></svg></span></button>
        <button onclick="insertJWLink()" title="Link Scriptural"><span class="icon"><svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg></span></button>
        
        <select id="note-tag-select">
            <option value="">Sem Categoria</option>
            <option value="Reunião Meio de Semana">Meio de Semana</option>
            <option value="Fim de Semana">Fim de Semana</option>
            <option value="Estudo Pessoal">Estudo Pessoal</option>
            <option value="Ministério">Ministério</option>
        </select>

        <select id="note-theme-select" onchange="applyVisualTheme(this.value)">
            <option value="padrao">Visual: Clean</option>
            <option value="importante">Visual: Alerta</option>
            <option value="destaque">Visual: Atenção</option>
            <option value="pesquisa">Visual: Estudo</option>
            <option value="meditacao">Visual: Oração</option>
        </select>
    </div>

    <div id="notes"></div>
    
    <div class="app-credits">
        Caderno de Anotações | Criado por <b>Diogo C Cass</b>
    </div>

    <div class="toast">Carregado</div>
</div>

<script>
    const doc = document;
    const qs = q => doc.querySelector(q);
    const qsa = q => [...doc.querySelectorAll(q)];
    
    let notesData = [];
    let currentEditingId = null;
    let toastTimeout = null;
    let activeTagFilter = "Todas";
    let deferredPrompt = null;

    window.onload = () => {
        loadTheme();
        loadNotes();
        setupLiveInputEngine();
        registerSingleFileServiceWorker();
        listenToInstallationPrompt();
    }

    function listenToInstallationPrompt() {
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            qs("#pwa-install-banner").classList.add("show");
        });

        window.addEventListener('appinstalled', () => {
            qs("#pwa-install-banner").classList.remove("show");
            deferredPrompt = null;
            toast("Aplicativo instalado com sucesso!");
        });
    }

    function triggerPWAInstallation() {
        if (!deferredPrompt) return;
        qs("#pwa-install-banner").classList.remove("show");
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
            deferredPrompt = null;
        });
    }

    function enterApp() {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
            docEl.requestFullscreen().catch(err => console.log("Fullscreen bloqueado:", err));
        } else if (docEl.webkitRequestFullscreen) {
            docEl.webkitRequestFullscreen();
        }
        qs("#splash").classList.add("fade-out");
    }

    function generateId() {
        return '_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
    }

    function toggleTheme() {
        const isDark = qs("body").classList.toggle("dark");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        toast("Esquema visual alterado");
    }

    function toggleSearch() {
        const container = qs("#search-container");
        const bar = qs("#search-bar");
        container.classList.toggle("active");
        if(container.classList.contains("active")) {
            bar.focus();
        } else {
            bar.value = "";
            filterNotes();
        }
    }

    function loadTheme() {
        if (localStorage.getItem("theme") === "dark") qs("body").classList.add("dark");
    }

    function toast(msg) {
        const toastEl = qs(".toast");
        if (toastTimeout) clearTimeout(toastTimeout);
        toastEl.innerText = msg;
        toastEl.classList.add("show");
        toastTimeout = setTimeout(() => toastEl.classList.remove("show"), 2500);
    }

    function renderTagsBar() {
        const bar = qs("#tags-bar");
        bar.innerHTML = "";
        const baseTags = ["Todas", "Reunião Meio de Semana", "Fim de Semana", "Estudo Pessoal", "Ministério"];
        baseTags.forEach(tag => {
            const pill = doc.createElement("span");
            pill.classList.add("tag-pill");
            if(tag === activeTagFilter) pill.classList.add("active");
            pill.innerText = tag === "Todas" ? "Ver Todas" : tag;
            pill.onclick = () => {
                activeTagFilter = tag;
                renderTagsBar();
                filterNotes();
            };
            bar.appendChild(pill);
        });
    }

    function loadNotes() {
        const localData = localStorage.getItem("spiritual_gems_v5_data");
        qs("#notes").innerHTML = "";
        if (localData) {
            notesData = JSON.parse(localData);
            notesData.forEach(data => renderNoteElement(data));
        }
        renderTagsBar();
        checkMarquees();
    }

    function saveToLocalStorage() {
        localStorage.setItem("spiritual_gems_v5_data", JSON.stringify(notesData));
    }

    function renderNoteElement(data) {
        let el = doc.createElement("div");
        el.classList.add("note");
        el.setAttribute("id", data.id);
        el.style.borderLeftColor = data.borderColor || "var(--SEP)";
        
        let titleContainer = doc.createElement("div");
        titleContainer.classList.add("note-title-container");
        
        let titleSpan = doc.createElement("span");
        titleSpan.classList.add("note-title-text");
        titleSpan.innerText = data.title || "Sem Título";
        
        titleContainer.appendChild(titleSpan);
        el.appendChild(titleContainer);
        
        if (data.tag) {
            let tagIndicator = doc.createElement("span");
            tagIndicator.classList.add("note-tag-indicator");
            tagIndicator.innerText = data.tag;
            el.appendChild(tagIndicator);
        }

        let contentPreview = doc.createElement("div");
        contentPreview.classList.add("note-body-preview");
        contentPreview.innerHTML = data.content;
        el.appendChild(contentPreview);

        el.onclick = () => openNote(data.id);
        qs("#notes").appendChild(el);
    }

    function checkMarquees() {
        setTimeout(() => {
            qsa(".note").forEach(note => {
                const container = note.querySelector(".note-title-container");
                const text = note.querySelector(".note-title-text");
                if (container && text) {
                    if (text.offsetWidth > container.offsetWidth) {
                        text.classList.add("marquee-active");
                    } else {
                        text.classList.remove("marquee-active");
                    }
                }
            });
        }, 120);
    }

    function applyVisualTheme(themeValue) {
        let borderColor = "#cbd5e1"; let fontColor = "#475569"; let backColor = "transparent";
        switch(themeValue) {
            case "importante": borderColor = "#ef4444"; fontColor = "#b91c1c"; backColor = "#fee2e2"; break;
            case "destaque": borderColor = "#eab308"; fontColor = "#a16207"; backColor = "#fef9c3"; break;
            case "pesquisa": borderColor = "#3b82f6"; fontColor = "#1d4ed8"; backColor = "#dbeafe"; break;
            case "meditacao": borderColor = "#10b981"; fontColor = "#047857"; backColor = "#d1fae5"; break;
        }
        const noteEl = doc.getElementById(currentEditingId);
        noteEl.setAttribute("data-pending-border", borderColor);
        format("foreColor", fontColor);
        format("hiliteColor", backColor);
    }

    function addNote() {
        const newId = generateId();
        const newData = { id: newId, title: "", content: "", tag: "", borderColor: "#6366f1", visualTheme: "padrao" };
        notesData.unshift(newData);
        saveToLocalStorage();
        loadNotes();
        openNote(newId);
    }

    function openNote(id) {
        currentEditingId = id;
        const data = notesData.find(n => n.id === id);
        
        qs("#title").innerText = data.title;
        qs("#note-tag-select").value = data.tag || "";
        qs("#note-theme-select").value = data.visualTheme || "padrao";
        qs(".wrapper").setAttribute("data-state", "edit");
        
        const noteEl = doc.getElementById(id);
        noteEl.innerHTML = data.content; 
        
        noteEl.setAttribute("data-edit", "true");
        noteEl.setAttribute("contenteditable", "true");
        noteEl.onclick = null;
        noteEl.focus();
        
        let range = doc.createRange();
        let sel = window.getSelection();
        range.selectNodeContents(noteEl);
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);
    }

    function saveNote() {
        if (!currentEditingId) return;
        
        const noteEl = doc.getElementById(currentEditingId);
        const titleText = qs("#title").innerText.trim();
        const contentHtml = noteEl.innerHTML.replace(/<br>/g, "").trim(); 
        
        if (!titleText && (!contentHtml || noteEl.innerText.trim() === "")) {
            notesData = notesData.filter(n => n.id !== currentEditingId);
            saveToLocalStorage();
            noteEl.remove();
            qs(".wrapper").setAttribute("data-state", "");
            currentEditingId = null;
            toast("Registro em branco removido");
            loadNotes();
            return;
        }
        
        const selectedTag = qs("#note-tag-select").value;
        const selectedTheme = qs("#note-theme-select").value;
        const pendingBorder = noteEl.getAttribute("data-pending-border") || notesData.find(n => n.id === currentEditingId)?.borderColor || "#6366f1";
        
        const index = notesData.findIndex(n => n.id === currentEditingId);
        if (index !== -1) {
            notesData[index].title = titleText || "Sem Título";
            notesData[index].content = noteEl.innerHTML;
            notesData[index].tag = selectedTag;
            notesData[index].visualTheme = selectedTheme;
            notesData[index].borderColor = pendingBorder;
        }
        
        saveToLocalStorage();
        
        noteEl.removeAttribute("data-edit");
        noteEl.removeAttribute("contenteditable");
        noteEl.removeAttribute("data-pending-border");
        
        qs(".wrapper").setAttribute("data-state", "");
        currentEditingId = null;
        toast("Modificações gravadas!");
        loadNotes();
    }

    function setupLiveInputEngine() {
        doc.addEventListener("input", function(e) {
            if (currentEditingId && e.target.id === currentEditingId) {
                const noteEl = e.target;
                const text = noteEl.innerHTML;
                const pattern = /\{\(([^)]+)\)\[([^\]]+)\]\}/g;
                
                if (pattern.test(text)) {
                    const sel = window.getSelection();
                    if (!sel.rangeCount) return;
                    
                    noteEl.innerHTML = text.replace(pattern, function(match, colorName, targetText) {
                        let hexColor = "var(--G500)"; 
                        let cleanColor = colorName.toLowerCase().trim();
                        
                        if (cleanColor === "azul") hexColor = "#3b82f6";
                        else if (cleanColor === "vermelho") hexColor = "#ef4444";
                        else if (cleanColor === "verde") hexColor = "#10b981";
                        else if (cleanColor === "amarelo") hexColor = "#eab308";
                        
                        return `<span style="color: ${hexColor}; font-weight: bold; display: inline;">${targetText}</span>\u200B`;
                    });
                    
                    let newRange = doc.createRange();
                    newRange.selectNodeContents(noteEl);
                    newRange.collapse(false);
                    sel.removeAllRanges();
                    sel.addRange(newRange);
                    toast("Destaque rápido aplicado!");
                }
            }
        });
    }

    function insertHighlightPlaceholder() {
        const placeholder = "{(azul)[Digite seu texto aqui]}";
        doc.execCommand("insertHTML", false, placeholder);
        const noteEl = doc.getElementById(currentEditingId);
        if (noteEl) noteEl.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function deleteNote() {
        if (!currentEditingId) return;
        if (confirm("Deseja deletar este estudo permanentemente?")) {
            notesData = notesData.filter(n => n.id !== currentEditingId);
            saveToLocalStorage();
            qs(".wrapper").setAttribute("data-state", "");
            currentEditingId = null;
            toast("Excluído com sucesso");
            loadNotes();
        }
    }

    function filterNotes() {
        const query = qs("#search-bar").value.toLowerCase();
        qsa(".note").forEach(el => {
            const id = el.getAttribute("id");
            const data = notesData.find(n => n.id === id);
            if (!data) return;

            const textContent = el.innerText.toLowerCase();
            const titleText = (data.title || "").toLowerCase();
            
            const matchesSearch = textContent.includes(query) || titleText.includes(query);
            const matchesTagFilter = (activeTagFilter === "Todas" || data.tag === activeTagFilter);

            if (matchesSearch && matchesTagFilter) {
                el.style.display = "flex";
                setTimeout(() => { el.style.opacity = "1"; el.style.transform = "translateY(0)"; }, 50);
            } else {
                el.style.opacity = "0";
                el.style.transform = "translateY(5px)";
                setTimeout(() => { el.style.display = "none"; }, 300);
            }
        });
    }

    function format(command, value = null) {
        doc.execCommand(command, false, value);
    }

    function insertJWLink() {
        const url = prompt("Cole o link aqui:", "https://wol.jw.org/");
        if (url) {
            const name = prompt("Nome amigável do link:", "Abrir referência");
            if (name) {
                const anchor = `<a href="${url}" target="_blank" style="color: var(--G500); font-weight:700; text-decoration: underline;">${name}</a>`;
                doc.execCommand("insertHTML", false, anchor);
            }
        }
    }

    function registerSingleFileServiceWorker() {
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'spiritual-gems-fullscreen-cache-v3';
                self.addEventListener('install', event => {
                    event.waitUntil(
                        caches.open(CACHE_NAME).then(cache => {
                            return cache.addAll(['/', '/index.html', location.pathname]).catch(() => {});
                        })
                    );
                    self.skipWaiting();
                });
                self.addEventListener('activate', event => event.waitUntil(self.clients.claim()));
                self.addEventListener('fetch', event => {
                    event.respondWith(
                        caches.match(event.request).then(res => {
                            if (res) return res;
                            return fetch(event.request).then(netRes => {
                                if (netRes && netRes.status === 200 && event.request.method === 'GET') {
                                    const copy = netRes.clone();
                                    caches.open(CACHE_NAME).then(cache => cache.put(event.request, copy));
                                }
                                return netRes;
                            }).catch(() => {
                                if (event.request.mode === 'navigate') return caches.match(location.pathname) || caches.match('/');
                            });
                        })
                    );
                });
            `;
            const blob = new Blob([swCode], { type: 'text/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob), { scope: './' }).catch(err => console.log(err));
        }
    }
</script>
</body>
</html>
